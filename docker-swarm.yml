version: '3.8'

services:
  webstack_nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/index.html:/usr/share/nginx/html/index.html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  webstack_apache:
    image: httpd:alpine
    ports:
      - "8082:80"
    volumes:
      - ./apache/index.html:/usr/local/apache2/htdocs/index.html
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

  haproxy:
    image: haproxy:alpine
    ports:
      - "8083:80" # <-- Diubah ke 80
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
